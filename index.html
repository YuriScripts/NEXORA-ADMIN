<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#edf3ff;font-family:Arial,sans-serif}
.container{max-width:1050px;margin:50px auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
h1{font-size:27px;letter-spacing:3px;color:#62a5ff}
.card{background:#111b2d;border:1px solid #263a58;border-radius:15px;padding:25px;margin-bottom:20px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #344a69;background:#0b1424;color:white}
button{background:#2477ed;border:0;font-weight:bold;cursor:pointer}
button:hover{background:#4690ff}
.secondary{background:#293b55}
.hidden{display:none}
.status{color:#8abaff;font-size:14px;margin-top:12px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
h2{font-size:19px}
small{color:#91a6c4}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<header>
<h1>NEXORA</h1>
<small>ADMIN CONTROL CENTER</small>
</header>

<section id="login" class="card">
<h2>Administrator Authentication</h2>
<p><small>Sign in using your administrator credentials.</small></p>
<input id="username" placeholder="Administrator username" autocomplete="username">
<input id="password" type="password" placeholder="Administrator password" autocomplete="current-password">
<button id="loginBtn" onclick="login()">Authenticate</button>
<div id="loginStatus" class="status">Ready to authenticate.</div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Administrator Dashboard</h2>
<p>Authentication successful.</p>
<button class="secondary" onclick="logout()">Logout</button>
</div>

<div class="grid">
<div class="card">
<h2>Create License</h2>
<input id="licenseName" placeholder="Customer / License name">
<input id="licenseDays" type="number" min="1" placeholder="Validity in days">
<button onclick="createLicense()">Generate License</button>
<div id="createStatus" class="status"></div>
</div>

<div class="card">
<h2>License Lookup</h2>
<input id="lookupKey" placeholder="Enter license key">
<button onclick="lookupLicense()">Check License</button>
<button class="secondary" onclick="revokeLicense()">Revoke License</button>
<div id="lookupStatus" class="status"></div>
</div>
</div>

<div class="card">
<h2>API Response</h2>
<pre id="output" class="status">No requests yet.</pre>
</div>
</section>
</div>

<script>
const API = "https://nexora-admin-api.creyyllaguno.workers.dev";

let sessionToken = sessionStorage.getItem("nexora_session");

async function request(path, method="GET", body=null) {
    const headers = {
        "Content-Type": "application/json"
    };

    if(sessionToken) {
        headers.Authorization = "Bearer " + sessionToken;
    }

    const response = await fetch(API + path, {
        method,
        headers,
        credentials: "include",
        body: body ? JSON.stringify(body) : null
    });

    const data = await response.json().catch(() => ({
        error: "Invalid server response"
    }));

    if(!response.ok) {
        throw new Error(data.error || data.message || "HTTP " + response.status);
    }

    return data;
}

function show(element, message) {
    document.getElementById(element).textContent = message;
}

async function login() {
    const button = document.getElementById("loginBtn");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if(!username || !password) {
        show("loginStatus","Enter your administrator credentials.");
        return;
    }

    button.disabled = true;
    show("loginStatus","Authenticating...");

    try {
        const result = await request("/admin/login","POST",{
            username,
            password
        });

        if(!result.token) {
            throw new Error("Server did not return a session token.");
        }

        sessionToken = result.token;
        sessionStorage.setItem("nexora_session",sessionToken);

        show("loginStatus","Authentication successful.");
        await verifySession();

    } catch(error) {
        show("loginStatus","Login failed: " + error.message);
    } finally {
        button.disabled = false;
    }
}

async function verifySession() {
    try {
        await request("/admin/verify");

        document.getElementById("login").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");

    } catch(error) {
        sessionToken = null;
        sessionStorage.removeItem("nexora_session");
        document.getElementById("login").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");
        show("loginStatus","Verification failed: " + error.message);
    }
}

async function createLicense() {
    try {
        const name = document.getElementById("licenseName").value.trim();
        const days = Number(document.getElementById("licenseDays").value);

        if(!name || !Number.isInteger(days) || days < 1) {
            throw new Error("Enter a name and valid number of days.");
        }

        const result = await request("/admin/licenses","POST",{
            name,
            days
        });

        show("createStatus",JSON.stringify(result,null,2));
        document.getElementById("output").textContent =
            JSON.stringify(result,null,2);

    } catch(error) {
        show("createStatus",error.message);
    }
}

async function lookupLicense() {
    try {
        const key = document.getElementById("lookupKey").value.trim();

        if(!key) throw new Error("Enter a license key.");

        const result = await request(
            "/admin/licenses/" + encodeURIComponent(key)
        );

        show("lookupStatus",JSON.stringify(result,null,2));
        document.getElementById("output").textContent =
            JSON.stringify(result,null,2);

    } catch(error) {
        show("lookupStatus",error.message);
    }
}

async function revokeLicense() {
    try {
        const key = document.getElementById("lookupKey").value.trim();

        if(!key) throw new Error("Enter a license key.");

        const result = await request(
            "/admin/licenses/" + encodeURIComponent(key) + "/revoke",
            "POST"
        );

        show("lookupStatus",JSON.stringify(result,null,2));
        document.getElementById("output").textContent =
            JSON.stringify(result,null,2);

    } catch(error) {
        show("lookupStatus",error.message);
    }
}

function logout() {
    sessionToken = null;
    sessionStorage.removeItem("nexora_session");
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
    show("loginStatus","Logged out.");
}

if(sessionToken) {
    verifySession();
}
</script>
</body>
</html>
