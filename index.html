<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA | Admin Control Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#edf3ff;font-family:Arial,sans-serif}
.container{max-width:1050px;margin:40px auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
h1{color:#62a5ff;letter-spacing:3px}
.card{background:#111b2d;border:1px solid #263a58;border-radius:15px;padding:24px;margin-bottom:20px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #344a69;background:#0b1424;color:white}
button{background:#2477ed;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#293b55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.hidden{display:none}
.status{color:#91baff;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#91a6c4}
table{width:100%;border-collapse:collapse;margin-top:15px}
td,th{padding:10px;text-align:left;border-bottom:1px solid #293b55}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>
<div class="container">
<header>
<h1>NEXORA</h1>
<small>ADMIN CONTROL CENTER</small>
</header>

<section id="login" class="card">
<h2>Administrator Login</h2>
<input id="password" type="password" placeholder="Administrator password">
<button id="loginBtn" onclick="login()">Authenticate</button>
<div id="loginStatus" class="status">Ready.</div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Dashboard</h2>
<p class="status">Administrator authenticated.</p>
<button class="secondary" onclick="logout()">Logout</button>
</div>

<div class="grid">
<div class="card">
<h2>Generate License</h2>
<input id="owner" placeholder="License owner">
<input id="days" type="number" min="1" max="3650" placeholder="Validity in days">
<button onclick="createLicense()">Generate Key</button>
<div id="createStatus" class="status"></div>
</div>

<div class="card">
<h2>License Management</h2>
<button onclick="loadLicenses()">Refresh Licenses</button>
<div id="licenseStatus" class="status"></div>
</div>
</div>

<div class="card">
<h2>License Database</h2>
<div class="tablewrap">
<table>
<thead><tr><th>Owner</th><th>Status</th><th>Expiration</th><th>Action</th></tr></thead>
<tbody id="licenseRows"></tbody>
</table>
</div>
</div>
</section>
</div>

<script>
const API="https://nexora-admin-api.creyyllaguno.workers.dev";
let token=sessionStorage.getItem("nexora_session");

async function api(path,method="GET",body=null){
 const headers={"Content-Type":"application/json"};
 if(token) headers.Authorization="Bearer "+token;

 const response=await fetch(API+path,{
  method,
  headers,
  body:body?JSON.stringify(body):null
 });

 const data=await response.json().catch(()=>({error:"Invalid server response"}));

 if(!response.ok) throw new Error(data.error||"HTTP "+response.status);
 return data;
}

function status(id,message){
 document.getElementById(id).textContent=message;
}

function showDashboard(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
}

function showLogin(){
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("dashboard").classList.add("hidden");
}

async function login(){
 const button=document.getElementById("loginBtn");
 const password=document.getElementById("password").value;

 if(!password){
  status("loginStatus","Enter your administrator password.");
  return;
 }

 button.disabled=true;
 status("loginStatus","Authenticating...");

 try{
  const result=await api("/api/login","POST",{password});

  if(!result.token) throw new Error("No session token returned.");

  token=result.token;
  sessionStorage.setItem("nexora_session",token);

  await verifySession();
 }catch(error){
  token=null;
  sessionStorage.removeItem("nexora_session");
  status("loginStatus",error.message);
 }finally{
  button.disabled=false;
 }
}

async function verifySession(){
 try{
  await api("/api/admin/me");
  showDashboard();
  await loadLicenses();
 }catch(error){
  token=null;
  sessionStorage.removeItem("nexora_session");
  showLogin();
  status("loginStatus","Verification failed: "+error.message);
 }
}

async function createLicense(){
 try{
  const owner=document.getElementById("owner").value.trim();
  const days=Number(document.getElementById("days").value);

  if(!owner||!Number.isInteger(days)||days<1||days>3650)
   throw new Error("Enter a valid owner and duration (1–3650 days).");

  const result=await api("/api/licenses","POST",{owner,days});

  status("createStatus",
   "LICENSE GENERATED\n\n"+result.key+
   "\n\nExpires: "+result.license.expiresAt);

  await loadLicenses();
 }catch(error){
  status("createStatus",error.message);
 }
}

async function loadLicenses(){
 try{
  const result=await api("/api/licenses");
  const rows=document.getElementById("licenseRows");
  rows.replaceChildren();

  for(const license of result.licenses){
   const tr=document.createElement("tr");

   const owner=document.createElement("td");
   owner.textContent=license.owner;

   const state=document.createElement("td");
   state.textContent=license.status;

   const expiry=document.createElement("td");
   expiry.textContent=new Date(license.expiresAt).toLocaleDateString();

   const action=document.createElement("td");

   if(license.status==="active"){
    const btn=document.createElement("button");
    btn.textContent="Revoke";
    btn.onclick=()=>revokeLicense(license.id);
    action.appendChild(btn);
   }else{
    action.textContent="—";
   }

   tr.append(owner,state,expiry,action);
   rows.appendChild(tr);
  }

  status("licenseStatus",result.licenses.length+" license(s) found.");
 }catch(error){
  status("licenseStatus",error.message);
 }
}

async function revokeLicense(id){
 if(!confirm("Revoke this license?"))return;

 try{
  await api("/api/licenses/"+encodeURIComponent(id)+"/revoke","POST");
  status("licenseStatus","License revoked.");
  await loadLicenses();
 }catch(error){
  status("licenseStatus",error.message);
 }
}

async function logout(){
 try{
  await api("/api/logout","POST");
 }catch(error){
  console.error(error);
 }finally{
  token=null;
  sessionStorage.removeItem("nexora_session");
  showLogin();
  status("loginStatus","Logged out.");
 }
}

if(token) verifySession();
</script>
</body>
</html>
