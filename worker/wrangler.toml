
name = "nexora-admin-api"
main = "src/index.js"
compatibility_date = "2026-11-19"

workers_dev = true

# Existing license database — KEEP THIS ID
[[kv_namespaces]]
binding = "LICENSE_DB"
id = "af1d9e6b2e6e4b878b50a4c81f29e4f7"

# Durable Object binding for license/device enforcement
[[durable_objects.bindings]]
name = "LICENSE_GUARD"
class_name = "LicenseGuard"

# Register the Durable Object with SQLite storage
[exports.LicenseGuard]
type = "durable-object"
storage = "sqlite"
